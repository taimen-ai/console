<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Field — превью</title>
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-sans); color: var(--text-primary); }
  #root { padding: 16px; }

</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.TaimenConsole, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'tc-form' },
      h(T.Field, { label: 'Что сделать', wide: true }, h('input', { className: 'tc-input', defaultValue: 'Сверить счёт №421 «Вектор»' })),
      h(T.Field, { label: 'Тип работы', help: 'Тип задаёт критерии приёмки и обычного исполнителя' }, h('select', { className: 'tc-select' }, h('option', null, 'Сверка счёта'), h('option', null, 'Оплата счёта'))),
      h(T.Field, { label: 'Срок' }, h('input', { className: 'tc-input', defaultValue: 'сегодня, 18:00' })),
      h(T.Field, { label: 'Ожидаемый результат', wide: true }, h('textarea', { className: 'tc-textarea', defaultValue: 'Счёт сверен с актом из 1С; расхождения устранены или описаны' }))));
</script>
</body>
</html>
