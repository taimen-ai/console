<html lang="ru">

<script>
  var T = window.TaimenConsole, h = React.createElement;

      h(T.IdentityBlock, { kind: 'agent', name: 'Сверщик счетов', label: 'Св', meta: 'r7 · агент', now: 'делает «Сверить счёт №417» · 12 мин' }),
      h(T.IdentityBlock, { kind: 'process', name: 'Оплата счетов', label: 'ОС', meta: 'процесс · v2', now: '5 дел идёт' }),
      h(T.IdentityBlock, { kind: 'process', name: 'invoice-received', label: '', meta: 'правило · включено' }))
  );
</script>
</body>
</html>
