<html lang="ru">
<head><meta charset="utf-8"><title>Pult — превью</title>
<style>
  body { margin: 0; background: var(--surface-page); }
  #root { padding: 0; }
  .pult { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, var(--layout-rail)); gap: var(--zone-pad); padding: var(--zone-pad); }
  .pult-left { display: flex; flex-direction: column; gap: var(--zone-pad); min-width: 0; }
  .pult-right { display: flex; flex-direction: column; gap: var(--zone-pad); min-width: 0; }
  .pult-two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--zone-pad); align-items: start; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .levers { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; font-size: 13px; }
  .levers li { padding: 8px 0; border-bottom: 1px solid var(--border-subtle); color: var(--text-secondary); }
  .levers li:last-child { border-bottom: 0; }
  .levers b { color: var(--text-primary); font-weight: 600; }

</style>
</head>
