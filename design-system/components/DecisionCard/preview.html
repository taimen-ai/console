<!-- @dsCard group="Пульт" height=790 subtitle="каноническое описание из ядра: последствия и доказательства до кнопки" width=1000 -->
<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>DecisionCard — превью</title>
<style>
  body { margin: 0; background: var(--surface-page); }
  #root { padding: 16px; }

</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.TaimenConsole, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { style: { display: 'grid', gridTemplateColumns: 'minmax(0, 520px) minmax(0, 420px)', gap: 16, alignItems: 'start' } },
      h(T.DecisionCard, {
        kind: 'Согласование', holds: true, due: 'срок сегодня 18:00',
        title: h('span', null, 'Согласовать оплату счёта «Альфа-Снаб», ', h('span', { className: 'tc-num' }, '184 500 ₽')),
        requester: { kind: 'process', name: 'Оплата счетов', label: 'ОС', meta: 'шаг «Согласование»' },
        since: 'с 12:37', delivery: { channel: 'Telegram', state: 'delivered', at: '12:40' },
        why: 'сумма выше порога 150 000 ₽ по таблице согласования.',
        yes: 'Бухгалтерия получит уведомление, работа перейдёт в «Оплачивается».',
        yesExternal: 'Внешний эффект: платёжное поручение в банк. Необратимо.',
        no: 'Счёт будет отозван, поставщику уйдёт письмо с причиной.',
        preconditions: [{ ok: true, text: 'Договор с «Альфа-Снаб» действует' }, { ok: true, text: 'Счёт сверен с поставкой' }],
        risk: 'high', evidence: ['Счёт №417 от 25.09 (PDF)', 'Акт сверки с поставкой — из 1С', 'Таблица согласования v3'],
        primary: 'Согласовать оплату', kbd: 'E' }),
      h('div', { style: { display: 'flex', flexDirection: 'column', gap: 16 } },
        h(T.DecisionCard, {
          kind: 'Приёмка', title: 'Принять заявку на тендер №0373200041',
          requester: { kind: 'agent', name: 'Подготовщик заявок', label: 'Пз', meta: 'r4' },
          since: 'с 11:02', why: 'вы — ответственный за тендерный отдел.',
          yes: 'Заявка уйдёт на подпись ЭЦП.', no: 'Вернётся исполнителю с причиной.',
          preconditions: [{ ok: false, text: 'Пока нельзя подписать: не приложена банковская гарантия' }],
          proposal: 'подать без гарантии нельзя — предлагаю запросить её у банка.',
          evidence: ['Заявка (DOCX)', 'Требования закупки'], primary: 'Принять' }),
        h(T.DecisionCard, {
          kind: 'Согласование', mine: false, title: 'Согласовать оплату счёта «Вектор», 96 000 ₽',
          requester: { kind: 'process', name: 'Оплата счетов', label: 'ОС' },
          readOnlyReason: 'Режим чтения: вы аудитор. Решает бухгалтерия (до 100 000 ₽).' })))
  );
</script>
</body>
</html>
