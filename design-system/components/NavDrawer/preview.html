<!-- @dsCard group="Каркас" height=560 subtitle="меню слева: организация, разделы, настройки" width=320 -->
<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>NavDrawer — превью</title>
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-sans); color: var(--text-primary); }
  #root { padding: 16px; }

</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.TaimenConsole, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { style: { width: 264, height: 520, border: '1px solid var(--border-subtle)' } },
      h(T.NavDrawer, { org: 'Полярис', pinned: true, onPin: function () {}, onClose: function () {}, groups: [
        { items: [{ label: 'Сегодня', icon: h(T.Icon, { name: 'today' }) }, { label: 'Работа', icon: h(T.Icon, { name: 'work' }), count: 2, human: true, active: true }, { label: 'База знаний', icon: h(T.Icon, { name: 'knowledge' }) }] },
        { title: 'Разделы — зададим позже', items: [{ placeholder: true }, { placeholder: true }] }],
        footer: h('a', { className: 'tc-nav-item', href: '#' }, h('span', { className: 'tc-nav-ico' }, h(T.Icon, { name: 'settings' })), h('span', { className: 'tc-nav-label' }, 'Настройки')) })));
</script>
</body>
</html>
