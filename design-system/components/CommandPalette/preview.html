<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>CommandPalette — превью</title>
<style>
  body { margin: 0; background: var(--surface-page); }
  #root { padding: 16px; }

</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.TaimenConsole, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h(T.CommandPalette, { query: 'альфа',
      groups: [
        { title: 'Работа', items: [
          { status: 'waiting_human', label: 'Согласовать оплату счёта «Альфа-Снаб»', hint: 'ждёт вас', selected: true },
          { status: 'verified', label: 'Оплатить счёт №417 «Альфа-Снаб»', hint: 'вчера' } ] },
        { title: 'Исполнители', items: [ { kind: 'process', label: 'Оплата счетов', glyph: 'ОС', hint: 'процесс · 5 дел' } ] },
        { title: 'Действия', items: [
          { label: 'Поручить работу…', kbd: 'N' },
          { label: 'Открыть ассистента', kbd: '⌘J' } ] }
      ] })
  );
</script>
</body>
</html>
