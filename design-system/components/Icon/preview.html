<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Icon — превью</title>
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-sans); color: var(--text-primary); }
  #root { padding: 16px; }

</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.TaimenConsole, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { style: { display: 'flex', gap: 16, color: 'var(--text-secondary)', flexWrap: 'wrap' } },
      ['search','chevronDown','check','x','warn','info','clock','file','menu','today','work','knowledge','settings','arrowLeft'].map(function (n) {
        return h('span', { key: n, title: n, style: { display: 'inline-flex' } }, h(T.Icon, { name: n }));
      })));
</script>
</body>
</html>
