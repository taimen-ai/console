<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>DegradedBanner — превью</title>
<style>
  body { margin: 0; background: var(--surface-page); }
  #root { padding: 16px; }

</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.TaimenConsole, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { style: { display: 'flex', flexDirection: 'column', gap: 10, maxWidth: 760 } },
      h(T.DegradedBanner, { kind: 'stale', at: '13:40' }),
      h(T.DegradedBanner, { kind: 'down', at: '13:40' }),
      h(T.DegradedBanner.Section, { text: 'Уведомления не ответили — доставки в Telegram не показаны. Данные ядра актуальны.' }))
  );
</script>
</body>
</html>
