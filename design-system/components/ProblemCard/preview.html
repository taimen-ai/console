<!-- @dsCard group="Пульт" height=540 subtitle="ошибка — объект с диагнозом и путём вперёд" -->
<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>ProblemCard — превью</title>
<style>
  body { margin: 0; background: var(--surface-page); }
  #root { padding: 16px; }

</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.TaimenConsole, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { style: { display: 'flex', flexDirection: 'column', gap: 12, maxWidth: 560 } },
      h(T.ProblemCard, { severity: 'failed',
        diagnosis: 'Агент «Сверщик» три раза не прошёл проверку по «Сверить счёт №421» — работа передана человеку',
        where: 'Оплата счетов → шаг «Проверить документы»', since: 'с 13:12',
        actions: [{ label: 'Открыть основание' }, { label: 'Изменить и продолжить' }, { label: 'Отключить агента' }] }),
      h(T.ProblemCard, { severity: 'blocked',
        diagnosis: 'У личности правила «Счёт получен» нет учётки — новые счета не заводятся',
        where: 'Правила игры → правила вывода', since: 'с 09:30',
        actions: [{ label: 'Завести учётку' }, { label: 'Открыть правило' }] }),
      h(T.ProblemCard, { severity: 'approaching',
        diagnosis: 'Срок удержания «Подготовить заявку №0373…» истекает через 20 мин',
        where: 'Взял агент «Подготовщик заявок»', since: 'до 14:20' }),
      h(T.ProblemCard.Calm, { text: 'Последняя проверка 14:02 · последнее событие: Иван согласовал оплату из Telegram, 12:41' }))
  );
</script>
</body>
</html>
