<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>SourceChip — превью</title>
<style>
  body { margin: 0; background: var(--surface-page); }
  #root { padding: 16px; }

</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.TaimenConsole, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { style: { display: 'flex', gap: 8, flexWrap: 'wrap' } },
      h(T.SourceChip, { source: 'authoritative' }),
      h(T.SourceChip, { source: 'recalled', freshness: 'запомнено 3 дня назад' }),
      h(T.SourceChip, { source: 'external', label: 'из 1С' }),
      h(T.SourceChip, { source: 'external', label: 'из ЕИС', freshness: '12:30' }))
  );
</script>
</body>
</html>
